services:
  db:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - teamrealestate_data:/var/lib/postgresql/data:rw

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - '${PGADMIN_PORT}:80'
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - teamrealestate_pgadmin:/var/lib/pgadmin/

volumes:
  teamrealestate_data:
  teamrealestate_pgadmin:
